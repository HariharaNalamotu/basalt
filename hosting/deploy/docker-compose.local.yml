# Local testing without Cloudflare: publish the edge and control API on loopback only.
services:
  edge:
    # *.localhost names resolve to ::1 as well as 127.0.0.1 (npm and Node try ::1 first).
    ports: ["127.0.0.1:8080:8080", "[::1]:8080:8080"]
    environment:
      TRUSTED_PROXIES: ""
      # Browsers reach apps at http://<app>.<root>:8080; backends and the Data service compare
      # the request's Origin against that.
      PUBLIC_SCHEME: http
      PUBLIC_PORT: "8080"
    networks:
      outbound: {}
  control:
    ports: ["127.0.0.1:4000:4000"]
    environment:
      # This development VM has 4 GB; production machines use the defaults.
      BUILD_MEMORY_MB: "1024"
      TEST_MEMORY_MB: "1024"
      MAX_CONCURRENT_BUILDS: "1"
      # Links handed to people (and Auth's allowed origins) use the local address.
      PUBLIC_SCHEME: http
      PUBLIC_PORT: "8080"
      # What basalt-admin create-workspace prints for the coding agent's connector.
      HOST_PUBLIC_URL: http://127.0.0.1:4000
      REGISTRY_PUBLIC_URL: http://registry.${ROOT_DOMAIN}:8080/
      # Windows can't resolve *.localhost outside the browser, so its connector uses this port.
      REGISTRY_LOOPBACK_URL: http://127.0.0.1:4873/
  verdaccio:
    # Loopback only. Reading is open; publishing needs the platform's own account.
    ports: ["127.0.0.1:4873:4873"]
  cloud:
    environment:
      # Owner pages (approvals, data map, safety receipt) through the local edge.
      PUBLIC_URL: http://cloud.${ROOT_DOMAIN}:8080
